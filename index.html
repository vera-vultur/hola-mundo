<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Una pequeña página para decir hola al mundo.">
  <title>Hola, mundo</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem; color: #f9fafb; background: radial-gradient(ellipse at 50% 0%, #273449 0%, #111827 58%); }
    main { width: min(100%, 680px); text-align: center; }
    .spark { display: inline-grid; place-items: center; width: 4rem; height: 4rem; margin-bottom: 1.5rem; border: 1px solid #475569; border-radius: 1.25rem; background: #1e293b; font-size: 1.8rem; }
    h1 { margin: 0; font-size: clamp(3rem, 12vw, 6.5rem); line-height: .98; letter-spacing: -.075em; }
    h1 span { color: #a5b4fc; }
    p { margin: 1.5rem 0 0; color: #cbd5e1; font-size: clamp(1rem, 3vw, 1.2rem); line-height: 1.7; }
    footer { margin-top: 3rem; color: #94a3b8; font-size: .875rem; }
  </style>
</head>
<body>
  <main>
    <div class="spark" aria-hidden="true">✦</div>
    <h1>Hola, <span>mundo.</span></h1>
    <p>Un pequeño comienzo para grandes ideas.<br>Hecho con HTML y un poco de CSS.</p>
    <footer>Una página simple, publicada en GitHub Pages.</footer>
  </main>
</body>
</html>
